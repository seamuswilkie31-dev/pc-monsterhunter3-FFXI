# FFXI layer for Monster Hunter Tri - settings.
#
# The port (pc-monsterhunter3) runs the European release, RMHP08: the addresses below are that disc's.
# Addresses found on the US release (RMHE08) will not carry over.

backend = "port"         # "port": the native port, run with MH3_FFXI=1 (tools/ffxi_bridge.cpp)
                         # "dolphin": Dolphin + Dolphin Memory Engine, with the same disc
name = "12345"           # your hunter, as the FFXI interface and its combat log call you
ffxi_assets = true       # FFXI's own window art from your installation (ffxi_assets.py ui), if extracted
window_theme = 1         # FFXI's window type: 1 classic navy, 2 silver, 3 dark blue, 4 stone, 5 grey, 6 deep blue
# FFXI's character in your hunter's place, from your FFXI installation: choose it with character.py
# (Play FFXI-MH3.bat: Character...). A race: hume_male, hume_female, elvaan_male, elvaan_female,
# tarutaru_male, tarutaru_female, mithra, galka; its look: each slot's model number ("" for no character).
character_race = "hume_male"
character_look = { face = 0, head = 0, body = 38, hands = 38, legs = 38, feet = 38, main = 4, sub = 24 }
character_model = "ROM/3/6.DAT"   # with character_race "": a model file instead (an NPC)
character_height = 175   # a male Hume's height in the game's units; the other races to scale
character_yaw = 0        # degrees, if it faces the wrong way
hide_hunter = true       # hide Monster Hunter's hunter while it's drawn
character_shadow = "ffxi"   # ffxi: FFXI's round shadow in place of Monster Hunter's foot shadows; mh: those
                         # kept; none
character_shadow_size = 1.0      # the round shadow's size, and how dark its middle is (0 to 1)
character_shadow_darkness = 0.55
mute_hunter_sounds = ["1:*"]   # the hunter's own sounds silenced, the race's voice in their place: "kind:code"
                         # (kind 1 its voice, 2 its feet, 3 its weapon; code in hex, * for all); [] for none
sounds = true            # FFXI's sounds from your FFXI installation: each spell's own as it goes off
sound_volume = 0.7       # 0 to 1
music = true             # FFXI's music in place of Monster Hunter's: the village's, the field's, battle music when
                         # engaged (the pieces: [music_tracks] below)
music_volume = 1.0       # 1: as loud as Monster Hunter's own music; FFXI's sounds and music follow the game's
                         # level in Windows' volume mixer
log_fade = 10            # the combat log's lines go this many seconds after they appear (0: they stay)
nameplate = true         # your name above your head, as in FFXI
nameplate_height = 200   # how high above your feet, in the game's units, with no FFXI character (with one: above its head)
target_arrow = true      # FFXI's arrow above your target (the nearest monster); hold L (the pad's LB) to lock on
all_magic = true         # every spell unlocked from the start (the Job menu's All Magic switches it in the game)
allow_kills = true       # FFXI's blows, magic and Trusts can finish a monster (false: the game's own last blow)
damage_through_game = true   # FFXI's damage dealt as the game's own (the monster flinches, falls, is carved)
mh_swings = true         # the pad's Y and B swing as in Monster Hunter beside FFXI's Attack (/mhcombat off: not
                         # while attacking: FFXI's auto-attack fights for you)
dpad_target = "engaged"  # the d-pad moves the target to the next monster that way: "engaged" (while attacking or
                         # locked on), "always" (the game's own use of the d-pad given up), "off"
ui = "game"              # game: the FFXI interface in the game's window (the port); window; console
job = "RDM"             # WAR, DRK, PLD, RDM, WHM, BLM  (see ffxi_data.py)
weapon = "sword_and_shield"   # great_sword, long_sword, sword_and_shield, hammer, lance,
                         # switch_axe, light_bowgun, heavy_bowgun
player_max_hp = 150      # used to cap Cures until you find a max-HP address

# ------------------------------------------------------------------------------------------------
# Memory addresses.
#
# With the port, the game's objects come from its hooks (tools/ffxi_bridge.cpp):
#   base = "player"    the local hunter's object       address = an offset in it
#   base = "monster"   the monster the game last hurt   address = an offset in it
# Elsewhere (Dolphin, or anything without a hook):
#   Simple address:    address = 0x80123456
#   Pointer chain:     address = 0x80123456   offsets = [0x10, 0x2A4]
# type = "u8", "u16", "u32" or "float"   (MH Tri is big-endian; the script handles that)
#
# Leave address = 0 for anything you haven't found yet - the script skips it.
# The port's bridge serves 8 addresses at most, each with up to 4 offsets.
#
# The offsets below are the European release's (RMHP08), read from the game's own code where the
# European Gecko codes patch it (ffxi/NEXT.md). The monster is whichever the game last hurt, so a small
# monster you hit becomes the target until the big one is hit again.
# ------------------------------------------------------------------------------------------------

[addresses.monster_hp]      # REQUIRED: s32 at +0x7A0 of the monster (mh3_EmHpAdd)
base = "monster"
address = 0x7A0
type = "u32"

[addresses.monster_max_hp]  # optional: the target window's percent (else the most HP seen)
base = "monster"            # s32 at +0x7A4, its max HP (ffxi/NEXT.md): confirmed in play
address = 0x7A4
type = "u32"

[addresses.player_hp]       # REQUIRED for Cures, Regen, Protect, Drain and spell interrupts
base = "player"             # s16 at +0x370 of the hunter (mh3_PlHpAdd)
address = 0x370
type = "u16"

[addresses.player_max_hp]   # optional: replaces player_max_hp above
base = "player"
address = 0x372
type = "u16"

# ------------------------------------------------------------------------------------------------
# Hotkeys = Windows virtual-key codes. The defaults use the number row: the port's keyboard mapping
# (build/keys.txt) leaves 3-0, - = [ ] and P free (1 and 2 are the Remote's buttons, H is Home, which
# crashes the port). The F-keys are avoided: Dolphin and the port use them.
#   0-9 = 0x30-0x39,  A-Z = 0x41-0x5A,  - = 0xBD,  = = 0xBB,  [ = 0xDB,  ] = 0xDD
#   Numpad 0-9 = 0x60-0x69,  Numpad * = 0x6A,  + = 0x6B,  - = 0x6D,  . = 0x6E,  / = 0x6F
# ------------------------------------------------------------------------------------------------
[hotkeys]
weapon_skills = [0x33, 0x34, 0x35, 0x36]                   # 3 4 5 6 -> your weapon's 4 WS
spells = [0x37, 0x38, 0x39, 0x30, 0xBD, 0xBB, 0xDB, 0xDD]  # 7 8 9 0 - = [ ] -> job spells in order
pause = 0x50                                               # P: pause / resume the layer


[music_tracks]
# FFXI's music for each place: the numbers of sound/win/music/data/musicNNN.bgw in your FFXI installation
# (ffxi_sound.py music N decodes one to listen to)
village = 112            # Selbina
town = 110               # The Grand Duchy of Jeuno
field = 109              # Ronfaure
battle = 101             # Battle Theme
tough_battle = 125       # Tough Battle (a large monster)
